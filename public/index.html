<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AIニュース" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css?v=2" />
  <title>今日のAIニュース</title>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">今日のAIニュース</h1>
    </div>
    <button class="reload-btn" id="reload-btn" aria-label="更新">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </header>

  <main id="main">
    <div id="loading" class="state state-loading">取得中...</div>
    <div id="error" class="state state-error" hidden>
      <p>ニュースを読み込めませんでした。</p>
      <button onclick="location.reload()" class="retry-btn">再読み込み</button>
    </div>

    <article id="content" hidden>
      <!-- TODAY'S OVERVIEW -->
      <section class="overview">
        <div class="section-label">TODAY'S OVERVIEW</div>
        <div class="overview-date" id="overview-date"></div>
        <p class="overview-text" id="overview-text"></p>
      </section>

      <!-- TOPICS -->
      <section class="topics">
        <div class="section-label">TOPICS</div>
        <ul id="topics-list" class="topics-list"></ul>
      </section>

      <!-- TODAY'S TIP -->
      <section class="tip">
        <div class="section-label">TODAY'S TIP</div>
        <div class="tip-card">
          <div class="tip-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
          </div>
          <div class="tip-body">
            <h3 class="tip-title" id="tip-title"></h3>
            <p class="tip-content" id="tip-content"></p>
          </div>
        </div>
      </section>
    </article>
  </main>

  <footer class="app-footer">
    <p id="footer-meta"></p>
    <p class="footer-sub">毎朝 6 時 JST に自動更新</p>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
