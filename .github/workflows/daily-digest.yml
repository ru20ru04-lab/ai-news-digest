name: Daily AI News Digest

on:
  schedule:
    # 19:30 UTC（前日）= 04:30 JST に開始
    # GitHub Actions の cron は混雑帯（毎時00分など）に数十分〜数時間遅延することがあるため、
    # 余裕を持って 04:30 JST に予約 → 遅延しても朝 6 時前後に配信完了する設計
    - cron: '30 19 * * *'
  workflow_dispatch:  # 手動：ニュース再生成 + デプロイ
  push:               # public/** の変更で：デプロイのみ（APIコールなし）
    branches: [main]
    paths:
      - 'public/**'

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    # スケジュール or 手動のときのみ実行（push では skip）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily digest update ($(date -u '+%Y-%m-%d %H:%MZ'))"
            git push
          fi

  deploy:
    needs: build
    # build が成功 OR スキップ（push の場合）どちらでも deploy する
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # build が push したコミットを確実に取得

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
